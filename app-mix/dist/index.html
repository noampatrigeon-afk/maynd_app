let enCours=false, ecrit=null, retourDemande=false;

/* ─────────── quota ─────────── */
function quotaJour(){ const q=etat.quota, j=cleJour(); if(q.jour!==j){ q.jour=j; q.n=0; } return q; }
function quotaMois(){ const q=etat.quota, m=cleMois(); if(q.mois!==m){ q.mois=m; q.nMois=0; } return q; }
function messagesRestants(){ return abonne() ? Math.max(0, QUOTA_MAYND_MOIS-quotaMois().nMois) : Math.max(0, QUOTA_GRATUIT_JOUR-quotaJour().n); }
function compterReponse(){ quotaJour().n++; quotaMois().nMois++; garder(); }

/* ─────────── le fil ─────────── */
function ajouterAuFil(m){ m.at=m.at||Date.now(); etat.fil.push(m); if(etat.fil.length>400) etat.fil=etat.fil.slice(-400); garder(); rendreFil(); return m; }
function rendrePresents(){

function boutonVoixHTML(id, i){

}
function rendreMsg(m, i, avecChoix){
  if(m.type==='user') return '<div class="msg moi"><div class="bulle">'+paragraphes(m.texte)+'</div></div>';
  if(m.type==='agent'){
    const a=AG[m.qui]||AG.mia;
    return '<div class="msg ag" style="--t:'+teinteDe(a.couleur)+';--c:'+a.couleur+'">'+avatar(a.id, 'petit')

  }
  if(m.type==='pro') return '<div class="msg pro"><span class="av petit pro" aria-hidden="true">'+badgePro()+'</span><div class="bulle"><span class="qui">'+badgePro()+esc(nomPro())+'</span>'+paragraphes(m.texte)+'</div></div>';
  if(m.type==='info') return '<p class="info">'+esc(m.texte)+'</p>';

  if(m.type==='acte'){
    const p=pasParId(m.pasId), fait=p && p.statut==='fait';
    return '<div class="carte carte-pas'+(fait?' fait':'')+'" style="--c:'+(AG[m.qui]||AG.mia).couleur+'"><span class="sur">Ton pas'+(m.quand?' · '+esc(m.quand):'')+'</span><p>'+esc(m.quoi)+'</p>'
      +(fait ? '<span class="ok">Fait</span>' : (p ? '<button class="lien-inline" data-action="pas-fait" data-id="'+p.id+'">C’est fait</button>' : ''))+'</div>';
  }
  if(m.type==='signal') return '<div class="carte carte-signal"><strong>Signal transmis à ton professionnel référent : '+esc(NOMS_SIGNAUX[m.signal]||m.signal)+'.</strong><p>Il te lit et intervient ici, sans rendez-vous, quand c’est utile.</p></div>';
  if(m.type==='crise') return carteCriseHTML(m);
  if(m.type==='cle') return '<div class="carte carte-cle"><p>Pour que MIA et les accompagnants te répondent, il faut une clé Anthropic.</p><button class="lien-inline" data-action="reglages">Ouvrir les réglages</button></div>';
  if(m.type==='jeu'){
    const a=AG[m.qui]; if(!a || typeof jeuDe!=='function' || !jeuDe(a.id)) return '';
    return '<div class="carte carte-jeu" style="--t:'+teinteDe(a.couleur)+'">'+avatar(a.id)+'<div><strong>Le jeu de '+esc(a.nom)+'</strong><span class="petit">Quelques questions à choix, une minute. Tu t’arrêtes quand tu veux.</span></div>'
      +'<button class="btn" data-action="jeu-ouvrir" data-id="'+a.id+'">Jouer</button></div>';
  }
  if(m.type==='formule'){
    if(abonne()) return '';
    const t=m.raison==='limite' ? 'Tes cinq messages gratuits d’aujourd’hui sont utilisés. Ils reviennent demain.' : (AG[m.qui]?AG[m.qui].nom:'Cet accompagnant')+' fait partie de l’abonnement MAYND.';
    return '<div class="carte carte-formule"><p>'+esc(t)+'</p><button class="lien-inline" data-action="formule-ouvrir" data-raison="'+esc(m.raison)+'">Découvrir MAYND</button></div>';

}
function rendreFil(){
  const f=document.getElementById('fil'); if(!f) return;
  let dernierAgent=-1;
  for(let i=etat.fil.length-1;i>=0;i--){ const t=etat.fil[i].type; if(t==='user') break; if(t==='agent'){ dernierAgent=i; break; } }
  f.innerHTML=typo(etat.fil.map(function(m, i){ return rendreMsg(m, i, i===dernierAgent && !enCours); }).join(''))
    +(ecrit ? '<div class="msg ag" style="--t:'+teinteDe(AG[ecrit].couleur)+'">'+avatar(ecrit, 'petit')+'<div class="bulle"><span class="points-ecrit" aria-label="'+esc(AG[ecrit].nom)+' écrit"><i></i><i></i><i></i></span></div></div>' : '');
  f.scrollTop=f.scrollHeight;
}

/* ─────────── l'onglet ─────────── */
ONGLETS.discussion=function(){
  return {html:'<div class="page">'
    +'<header class="chat-tete"><div class="presents" id="presents"></div><button class="b-menu" data-action="menu-discussion" aria-label="Menu">⋯</button></header>'
    +'<div class="fil" id="fil" aria-live="polite"></div>'
    +'<div class="saisie"><textarea id="message" rows="1" maxlength="2000" aria-label="Ton message"></textarea>'
    +'<button class="b-envoi" data-action="envoyer" aria-label="Envoyer">↑</button></div></div>',

};
function entrerDiscussion(){
  rendrePresents(); rendreFil();
  const ta=document.getElementById('message');
  ta.addEventListener('input', function(){ ta.style.height='auto'; ta.style.height=Math.min(ta.scrollHeight, 160)+'px'; });
  ta.addEventListener('keydown', function(ev){ if(ev.key==='Enter' && !ev.shiftKey){ ev.preventDefault(); envoyerSaisie(); } });
  if(!etat.fil.length){ premierMessage(); return; }
  let dernier=0; etat.fil.forEach(function(m){ if(m.at) dernier=Math.max(dernier, m.at); });
  const ecart=Date.now()-dernier;
  if(retourDemande && etat.cle && dernier && ecart>3*3600000 && !enCours){
    ajouterAuFil({type:'info', texte:'Bon retour. MIA reprend là où vous en étiez.'});
    etat.actif='mia'; rendrePresents();
    reponse('mia', {retour:dureeEnMots(ecart)});
  }
  retourDemande=false;
}
function premierMessage(){
  if(etat.cle){ reponse('mia', {premier:true}); return; }
  const p=prenom(), cap=etat.rep.cap;
  /* Ce message est écrit par l'application, pas par le modèle : il part dans la langue choisie (60-langue.js). */
  const T=function(s){ return typeof traduire==='function' ? traduire(s) : s; };
  ajouterAuFil({type:'agent', qui:'mia', texte:T((p?p+', j':'J')+'’ai lu tout ton parcours.')+' '+(cap?T('Ton cap : « '+cite(cap)+' ».')+' '+T('On commence par là ?'):T('Par quoi veux-tu commencer ?')),
    choix:cap?[T('On commence par là'), T('Plutôt autre chose')]:null});
  ajouterAuFil({type:'cle'});
}
function envoyerSaisie(){
  const ta=document.getElementById('message'); if(!ta) return;
  const t=ta.value.trim(); if(!t || enCours) return;
  ta.value=''; ta.style.height='auto';
  envoyer(t);
}
function envoyer(texte){
  texte=String(texte||'').trim(); if(!texte || enCours) return;
  ajouterAuFil({type:'user', texte:texte});
  const r=risqueLocal(texte);
  if(r) declencherCrise(r, texte, 'local');
  if(!etat.cle){ ajouterAuFil({type:'cle'}); return; }
  /* Le risque passe avant la limite du gratuit ; au-delà, la carte de prévention suffit. */
  if(!messagesRestants()){ if(!r) ajouterAuFil({type:'formule', raison:'limite'}); return; }
  reponse(etat.actif, {risque:r});
}

/* ─────────── la consigne du tour ─────────── */
function motsDe(s){ return String(s||'').trim().split(/\s+/).filter(Boolean).length; }
function consigneTour(qui, o){
  const L=['Consigne pour cette réponse (elle prime sur tes habitudes, jamais sur la sécurité) :'];
  const now=new Date();
  L.push('Moment : '+JOURS_FR[now.getDay()]+' '+now.getDate()+' '+MOIS_FR[now.getMonth()]+', '+now.getHours()+' h '+String(now.getMinutes()).padStart(2, '0')+'.');
  if(o.premier) L.push("C'est ta toute première réponse : la personne vient de finir son parcours d'accueil et arrive dans la discussion. Pas de question générique. En une ou deux phrases, montre-lui que tu as saisi l'essentiel de ce qu'elle vit, avec un détail précis de son compte-rendu, dans ses mots si possible. Puis propose de commencer par son cap, et termine par une seule question précise, avec une balise CHOIX.");
  if(o.retour){
    const pas=pasDuMoment();
    L.push('La personne revient dans la discussion après '+o.retour+'. Accueille-la en une phrase, rattache-toi à ce qui était en cours'
      +(pas?', notamment son pas : « '+pas.texte+' » (prévu '+quandLib(pas)+')':'')+', puis une seule question.');
  }
  if(o.arrivee) L.push("MIA vient de te faire venir. La personne n'a rien à répéter : tu as tout l'échange et son dossier. Présente-toi en une phrase courte, puis va droit à ce qui l'aide.");
  if(o.finJeu) L.push(o.finJeu);
  if(o.risque){
    L.push("Sécurité : son dernier message laisse voir un risque. Applique le protocole de sécurité. L'application a déjà affiché les numéros d'urgence."
      +(abonne() ? ' Son professionnel référent a été prévenu : tu peux le lui dire, simplement.' : " Formule gratuite : il n'y a pas de professionnel. Ne dis jamais que quelqu'un est prévenu."));
    return L.join('\n');
  }
  const users=etat.fil.filter(function(m){ return m.type==='user'; });
  const dernier=users.length ? String(users[users.length-1].texte||'') : '', dn=normaliser(dernier);
  const assist=etat.fil.filter(function(m){ return m.type==='agent'; }).slice(-2);
  const serieQuestions=assist.length===2 && assist.every(function(m){ return /\?\s*$/.test(String(m.texte||'').trim()); });
  const court=users.length>0 && (motsDe(dernier)<=4 || /^(bof|je sais pas|je ne sais pas|j'sais pas|chais pas|ouais|mouais|ok|bah|pas trop|aucune idee|rien)\b/.test(dn));
  const demande=/\?\s*$/.test(dernier.trim()) || /^(comment|pourquoi|est-ce que|qu'est-ce|peux-tu|tu peux|aide-moi|explique|que faire|quoi faire)\b/.test(dn);
  const info=derniereLecture && derniereLecture.information_manquante && INFO_MANQUANTE[derniereLecture.information_manquante];
  if(!o.premier){
    if(serieQuestions) L.push('Question : aucune cette fois. Tes deux dernières réponses finissaient par une question : apporte quelque chose.');
    else if(court) L.push('Elle écrit court : pas de question ouverte. Propose quelque chose, ou offre deux ou trois choix simples avec la balise [[CHOIX:…]].');
    else if(demande) L.push('Elle te demande quelque chose de précis : réponds d’abord, concrètement. Une question ensuite seulement si sa réponse change ta proposition.');
    else if(info) L.push('Ce qui manque encore pour lui proposer un pas qui lui ressemble : '+info+'. Tu peux le demander, en une seule question, en dernière phrase.');
    else L.push('Question : facultative, une au plus, seulement si sa réponse change ce que tu vas proposer.');
  }
  const hr=now.getHours(), tard=(hr>=23 || hr<6);
  L.push(consigneLongueur()+(tard ? ' Il est tard : rien d’ambitieux, ce qui peut attendre demain attend demain.' : ''));
  const p=pasASuivre();
  if(p && !o.arrivee && !o.finJeu){ L.push('Pas à suivre : « '+p.texte+' », prévu '+quandLib(p)+'. Si le moment s’y prête, demande-lui simplement où elle en est, jamais comme un contrôle.'); p.evoque=1; garder(); }
  if(!abonne()){
    if(messagesRestants()===1) L.push('C’est son dernier message gratuit aujourd’hui : termine par ce que tu retiens et un pas simple pour demain. Ne parle pas d’abonnement.');
    L.push('Formule gratuite : tu peux nommer l’accompagnant qui aiderait, sans insister, mais tu ne le fais pas venir toi-même : l’application s’en charge.');
  }
  if(qui==='mia' && (court || (derniereLecture && derniereLecture.energie==='basse')) && users.length<=3 && typeof jeuDe==='function') L.push('Si elle ne sait pas par où commencer, tu peux lui proposer le jeu de l’accompagnant le plus proche de ce qu’elle vit, avec la balise [[JEU:identifiant]].');
  return L.join('\n');
}
function messagesPour(qui, o){
  const M=[{role:'user', content:"(La personne vient de terminer son parcours d'accueil et ouvre la discussion.)"}];
  etat.fil.slice(-60).forEach(function(m){
    if(m.type==='user') M.push({role:'user', content:m.texte});
    else if(m.type==='agent') M.push({role:'assistant', content:(m.qui===qui?'':'['+AG[m.qui].nom+'] ')+m.texte});
    else if(m.type==='pro') M.push({role:'assistant', content:'[Professionnel référent] '+m.texte});
  });
  if(o.retour) M.push({role:'user', content:'(La personne revient dans la discussion.)'});
  if(o.arrivee) M.push({role:'user', content:"(MIA t'a fait venir. La personne attend ta première réponse.)"});
  if(o.finJeu) M.push({role:'user', content:'(Elle vient de finir ton jeu. Réponds à ce récapitulatif.)'});
  if(M[M.length-1].role!=='user') M.push({role:'user', content:'(La personne attend ta réponse.)'});
  return M;
}

/* ─────────── la réponse et ses suites ─────────── */
function faireVenir(id, o){
  if(!AG[id] || id==='mia') return;
  if(!abonne()){ ajouterAuFil({type:'formule', raison:'accompagnant', qui:id}); return; }
  if(etat.presents.indexOf(id)<0){ etat.presents.push(id); ajouterAuFil({type:'info', texte:AG[id].nom+' rejoint la discussion.'}); }
  etat.actif=id; garder(); rendrePresents();
  return reponse(id, Object.assign({arrivee:true}, o||{}));
}
async function traiter(qui, brut){
  const b=lireBalises(brut);
  if(b.texte) ajouterAuFil({type:'agent', qui:qui, texte:b.texte, choix:b.choix});
  compterReponse();
  if(b.actes.length){
    enregistrerPas(b.actes, qui);
    b.actes.forEach(function(a){ const p=dossierObj().pas.find(function(x){ return x.texte===a.quoi.slice(0,140) && x.statut!=='fait'; }); ajouterAuFil({type:'acte', qui:qui, quoi:a.quoi, quand:a.quand, pasId:p?p.id:null}); });
  }
  b.signaux.forEach(function(s){ if(typeof poserSignal==='function') poserSignal(s, qui, false); });
  if(b.crise) declencherCrise(2, '', qui);
  if(b.jeu && typeof jeuDe==='function' && jeuDe(b.jeu)) ajouterAuFil({type:'jeu', qui:b.jeu});
  if(typeof voixApresReponse==='function') voixApresReponse(qui, b.texte);
  if(b.invite && qui==='mia' && AG[b.invite] && b.invite!=='mia') return faireVenir(b.invite);
  if(typeof proApresReponse==='function') proApresReponse();
}
async function reponse(qui, o){
  o=o||{};
  if(enCours) return;
  enCours=true; ecrit=qui; rendreFil();
  try{
    const res=await appeler(systeme(qui, consigneTour(qui, o)), messagesPour(qui, o));
    ecrit=null; enCours=false;
    if(res.refus) ajouterAuFil({type:'info', texte:AG[qui].nom+" n'a pas pu répondre à ce message. Tu peux le dire autrement ?"});
    else if(!res.texte) ajouterAuFil({type:'erreur', texte:'La réponse est arrivée vide.'});
    else await traiter(qui, res.texte);
    programmerLecture();
  }catch(err){
    ecrit=null; enCours=false;
    ajouterAuFil({type:'erreur', texte:messageErreur(err)});
  }
  rendreFil();
}

/* ─────────── la formule MAYND ─────────── */
let formuleRaison='';
function formuleHTML(){
  const p=prenom();
  return '<div class="formule"><p class="sur">La formule MAYND</p>'
    +'<h1 class="grand">'+(p?esc(p)+', tout' : 'Tout')+' MAYND, sans limite.</h1>'

    +'<ul><li>Les seize accompagnants, que MIA fait venir au bon moment</li><li>Un professionnel référent certifié, humain, qui suit ton parcours et intervient sur signal</li><li>La voix de chaque accompagnant</li><li>'+QUOTA_MAYND_MOIS+' messages par mois</li></ul>'
    +'<div class="paiement" id="paiement" hidden><label class="etiquette" for="p-carte">Carte bancaire</label><input class="champ" id="p-carte" inputmode="numeric" autocomplete="cc-number" placeholder="4242 4242 4242 4242" maxlength="19">'
    +'<div class="rangee"><input class="champ" id="p-exp" inputmode="numeric" autocomplete="cc-exp" placeholder="MM/AA" maxlength="5"><input class="champ" id="p-cvc" inputmode="numeric" autocomplete="cc-csc" placeholder="CVC" maxlength="4"></div>'

}
function ouvrirFormule(raison){
  formuleRaison=raison||'';
  const pl=document.getElementById('plein');
  pl.innerHTML=typo(formuleHTML()); pl.classList.add('ouvert'); pl.setAttribute('aria-hidden', 'false'); pl.scrollTop=0;
  const meta=document.querySelector('meta[name="theme-color"]'); if(meta) meta.setAttribute('content', VIOLET);
}
function fermerPlein(){ const pl=document.getElementById('plein'); pl.classList.remove('ouvert'); pl.setAttribute('aria-hidden', 'true'); setTimeout(function(){ if(!pl.classList.contains('ouvert')) pl.innerHTML=''; }, 500); }
ACTIONS['formule-ouvrir']=function(b){ ouvrirFormule(b.dataset.raison||''); };
ACTIONS['formule-fermer']=fermerPlein;
ACTIONS['formule-choisir']=function(){ document.getElementById('paiement').hidden=false; document.getElementById('formule-boutons').hidden=true; const c=document.getElementById('p-carte'); if(c) c.focus(); };
ACTIONS['formule-payer']=function(){
  const c=String((document.getElementById('p-carte')||{}).value||'').replace(/\s/g, '');
  if(c.length<12){ toast('Un numéro de carte, même factice, pour la démonstration.'); return; }
  etat.formule='maynd'; etat.paye=Date.now(); garder();

  const attente=etat.fil.slice().reverse().find(function(m){ return m.type==='formule' && m.raison==='accompagnant' && m.qui; });

};

/* ─────────── actions ─────────── */
ACTIONS.envoyer=envoyerSaisie;
ACTIONS.repondre=function(b){ envoyer(b.dataset.texte); };
ACTIONS['parler-a']=function(b){ etat.actif=b.dataset.id; garder(); rendrePresents(); const ta=document.getElementById('message'); if(ta) ta.focus(); };

  if(!etat.fil.some(function(m){ return m.type==='agent'; })) reponse('mia', {premier:true}); else reponse(etat.actif, {});

ACTIONS['menu-discussion']=function(){
  ouvrir('<h2>MAYND</h2><div class="menu">'+lienBouton('Mon compte-rendu', 'cr-ouvrir')+lienBouton('Mon professionnel référent', 'pro-ouvrir')+lienBouton('Réglages', 'reglages')+lienBouton('Faire une pause', 'pause')+'</div>');

ACTIONS.pause=function(){
  const p=prenom(), o=valeurChoix('moment_parler'), pas=pasDuMoment();

<script>
/* ══════════════════════════════════════════════════════════════════════════
   APP MIX — LE DOSSIER, LES PAS, LA LECTURE DES MESSAGES (13/11/2026)
   Repris de MAYND (38-dossier-et-suivi.js).
   1. Le dossier commun (etat.dossier) : ce que MAYND apprend dans les échanges.
      Le compte-rendu du parcours en est la base ; la lecture des messages
      l'enrichit. La personne le voit dans Toi ; une ligne effacée n'est jamais
      réécrite.
   2. Les pas datés : [[ACTE:texte|quand]] crée un pas avec une échéance.
      Aujourd'hui montre « Ton pas ». L'accompagnant y revient au bon moment.
   3. La lecture différée : huit secondes après une réponse, un appel court
      (claude-haiku-4-5) lit le dernier message et rend un JSON : risque, signal,
      phase, besoin, énergie, information manquante, pas évoqués, faits.
   4. Le bloc « dossier » envoyé au modèle : compte-rendu + lignes lues + façon
      de parler, repris du Tunnel.
   ══════════════════════════════════════════════════════════════════════════ */

/* ─────────── 1. le dossier ─────────── */
function dossierObj(){
  const d=etat.dossier;
  ['faits','personnes','aide','marchePas','facon','refusees','aVenir','pas','effaces'].forEach(function(k){ if(!Array.isArray(d[k])) d[k]=[]; });
  if(typeof d.situation!=='string') d.situation='';
  return d;
}
function dossierEfface(texte){ const n=String(texte||'').trim().toLowerCase(); return dossierObj().effaces.some(function(x){ return String(x).trim().toLowerCase()===n; }); }
function dossierAjouter(liste, texte, max){
  const d=dossierObj(), s=String(texte||'').trim(); if(!s || s.length>300 || dossierEfface(s)) return false;
  const l=d[liste]; if(l.some(function(x){ return String(x).trim().toLowerCase()===s.toLowerCase(); })) return false;
  l.push(s); if(l.length>(max||30)) d[liste]=l.slice(-(max||30));
  return true;
}
function evenementTs(e){ const m=String(e.date||'').match(/^(\d{4})-(\d{2})-(\d{2})/); return m ? new Date(+m[1], +m[2]-1, +m[3], 12).getTime() : 0; }
function quandLib(p){ return p.echeance ? dateLib(p.echeance) : (p.quandTexte || 'cette semaine'); }
function dossierLignes(){
  const d=dossierObj(), L=[];
  if(d.situation) L.push('sa situation en ce moment, d’après les échanges : '+d.situation);
  if(d.personnes.length) L.push('les personnes qui comptent dans ce qu’elle raconte : '+d.personnes.slice(-8).join(' ; '));
  if(d.faits.length) L.push('ce qu’on a appris d’elle dans les échanges : '+d.faits.slice(-12).join(' ; '));
  if(d.aide.length) L.push('ce qui l’aide : '+d.aide.slice(-6).join(' ; '));
  if(d.marchePas.length) L.push('ce qui ne marche pas pour elle : '+d.marchePas.slice(-6).join(' ; '));
  const enCours=d.pas.filter(function(p){ return p.statut==='en_cours'||p.statut==='reporte'; });
  if(enCours.length) L.push('ses pas en cours, à ne pas reproposer sous une autre forme : '+enCours.slice(-5).map(function(p){ return '« '+p.texte+' », prévu '+quandLib(p)+(p.reports?' (repoussé '+p.reports+' fois)':''); }).join(' ; '));
  const faits=d.pas.filter(function(p){ return p.statut==='fait' && p.faitLe && (Date.now()-p.faitLe)<14*86400000; });
  if(faits.length) L.push('pas faits ces deux dernières semaines : '+faits.slice(-4).map(function(p){ return '« '+p.texte+' »'; }).join(' ; '));
  const ev=d.aVenir.filter(function(e){ return e.date && evenementTs(e)>=Date.now()-86400000; });
  if(ev.length) L.push('ce qui l’attend : '+ev.slice(0,4).map(function(e){ return e.quoi+' ('+dateLib(evenementTs(e))+')'; }).join(' ; '));
  if(d.refusees.length) L.push('pistes qu’elle a refusées, à ne jamais reproposer : '+d.refusees.slice(-6).join(' ; '));
  if(d.hypothese && d.hypothese.texte) L.push('hypothèse de fond, à confirmer : '+d.hypothese.texte+' (certitude '+(d.hypothese.certitude||'faible')+')');
  return L;
}
function dossierEffacer(liste, i){
  const d=dossierObj(); let texte=null;
  if(liste==='situation'){ texte=d.situation; d.situation=''; }
  else if(liste==='pas'){ const p=d.pas[i]; if(p){ texte=p.texte; d.pas.splice(i, 1); } }
  else if(liste==='aVenir'){ const e=d.aVenir[i]; if(e){ texte=e.quoi; d.aVenir.splice(i, 1); } }
  else if(Array.isArray(d[liste])){ texte=d[liste][i]; d[liste].splice(i, 1); }
  if(texte && !dossierEfface(texte)) d.effaces.push(String(texte));
  garder();
}

/* ─────────── 2. les pas datés ─────────── */
function enregistrerPas(actes, auteur){
  const d=dossierObj(), now=Date.now();
  (actes||[]).forEach(function(a){
    const texte=String(a.quoi||'').trim(); if(!texte) return;
    if(d.pas.some(function(x){ return x.texte.toLowerCase()===texte.toLowerCase() && x.statut!=='fait'; })) return;
    d.pas.push({id:'p'+now+Math.floor(Math.random()*999), texte:texte.slice(0,140), quandTexte:String(a.quand||'').slice(0,40),
      echeance:parseQuand(a.quand)||(now+3*86400000), agent:auteur||'mia', statut:'en_cours', cree:now, evoque:0});
  });
  if(d.pas.length>30) d.pas=d.pas.slice(-30);
  garder();
}
function pasParId(id){ return dossierObj().pas.find(function(p){ return p.id===id; }); }
function pasDuMoment(){
  const l=dossierObj().pas.filter(function(p){ return p.statut==='en_cours' || p.statut==='reporte'; });
  l.sort(function(a, b){ return (a.echeance||0)-(b.echeance||0); });
  return l[0]||null;
}
function marquerPasFait(p){ if(!p || p.statut==='fait') return; p.statut='fait'; p.faitLe=Date.now(); garder(); }
function pasASuivre(){
  const now=Date.now();
  const l=dossierObj().pas.filter(function(p){ return (p.statut==='en_cours'||p.statut==='reporte') && p.echeance && p.echeance<=now && p.echeance>now-7*86400000 && !p.evoque; });
  l.sort(function(a, b){ return b.echeance-a.echeance; });
  return l[0]||null;
}
ACTIONS['pas-fait']=function(b){ marquerPasFait(pasParId(b.dataset.id)); toast('C’est noté. Un pas de plus.'); rafraichirOnglet(); if(typeof rendreFil==='function') rendreFil(); };
ACTIONS['pas-encore']=function(b){
  const p=pasParId(b.dataset.id); if(!p) return;
  p.statut='reporte'; p.reports=(p.reports||0)+1; p.echeance=Date.now()+2*86400000; p.evoque=0; garder();
  toast('D’accord. On en reparle dans deux jours.'); rafraichirOnglet();
};
ACTIONS['pas-parler']=function(b){
  const p=pasParId(b.dataset.id); if(!p) return;
  const qui=(p.agent && etat.presents.indexOf(p.agent)>=0) ? p.agent : 'mia';
  etat.actif=qui; garder();
  montrerOnglet('discussion');
  setTimeout(function(){ try{ const i=document.getElementById('message'); i.value='À propos de « '+p.texte+' » : '; i.focus(); }catch(_){} }, DUREE+120);
};

/* ─────────── 3. la lecture différée ─────────── */
const LECTURE_SYSTEM=`Tu lis, pour l'équipe MAYND, le dernier message d'une personne dans une discussion avec un accompagnant. Ta lecture n'est jamais montrée à la personne. Tu réponds uniquement par l'objet JSON demandé, sans texte autour.

Tu reçois son dossier, ses pas en cours, les derniers échanges, et son dernier message : c'est celui que tu lis.

risque
0 : rien de préoccupant.
1 : mal-être marqué, sans idée de mort ni de se faire du mal.
2 : idée de mort ou de se faire du mal, même vague, même au détour d'une phrase ou sur le ton de la blague.
3 : projet, moyen, moment choisi, geste en cours, ou danger immédiat pour elle ou pour quelqu'un d'autre.
En cas de doute entre deux niveaux, prends le plus élevé. Pour 2 et 3, recopie la phrase exacte dans risque_citation.

signal
Un des quatre signaux de MAYND, ou null. Jamais d'autre.
stagnation : rien ne bouge depuis plusieurs échanges, malgré des pas proposés.
blocage : elle bute sur quelque chose qu'elle ne parvient pas à dépasser seule, ou une souffrance demande un regard humain.
desalignement : ce qu'elle vit ou choisit s'éloigne nettement de son cap.
progression : un progrès réel, qui mérite d'être consolidé.
Recopie la preuve dans signal_preuve. Le plus souvent, signal vaut null.

phase : accueillir, comprendre, agir, suivre (elle revient sur un pas), apaiser (elle est submergée, maintenant).
besoin : ecoute, comprendre, decider, agir, information.
energie : basse, normale ou haute, d'après sa façon d'écrire.
demande_precise : vrai si elle pose une question ou demande quelque chose de précis.
information_manquante : ce qui manque encore pour lui proposer un pas qui lui ressemble : situation, ce_qui_compte, deja_essaye, ou null.
terrain : l'identifiant de l'accompagnant dont le terrain porte le cœur du message (naoki, felix, atlas, ava, leo, otis, kael, miro, sol, mateo, soren, iris, eden, vince, neo, nora), ou null.
pas_evoques : pour chaque pas en cours que son message évoque, son identifiant et son statut : fait, pas_fait, reporte, abandonne.
faits_nouveaux : les faits durables appris dans ce message, une phrase chacun, à la troisième personne, sans mot clinique ni interprétation.
a_venir : les événements datés qu'elle mentionne, avec la date au format AAAA-MM-JJ quand elle se déduit.
hypothese_refusee : la piste qu'elle vient de refuser, en quelques mots, ou null.

Format exact :
{"risque":0,"risque_citation":null,"signal":null,"signal_preuve":null,"phase":"comprendre","besoin":"ecoute","energie":"normale","demande_precise":false,"information_manquante":null,"terrain":null,"pas_evoques":[],"faits_nouveaux":[],"a_venir":[],"hypothese_refusee":null}`;
const INFO_MANQUANTE={situation:'la situation concrète (quand, où, avec qui)', ce_qui_compte:'ce qui compte pour elle là-dedans', deja_essaye:'ce qu’elle a déjà essayé'};
const LECTURE_DELAI_MS=/[?&]rapide\b/.test(location.search) ? 30 : 8000;
let lectureTimer=null, derniereLecture=null, luJusqua=0;
function modeleLecture(){ return etat.fournisseur==='deepseek' ? 'deepseek-flash' : MODELE_LECTURE; }
function programmerLecture(){ clearTimeout(lectureTimer); lectureTimer=setTimeout(lireDiscussion, LECTURE_DELAI_MS); }
function extraireJSON(s){
  const t=String(s||''), a=t.indexOf('{'), b=t.lastIndexOf('}');
  if(a<0 || b<=a) return null;
  try{ return JSON.parse(t.slice(a, b+1)); }catch(_){ return null; }
}
function pasEnCoursListe(){
  return dossierObj().pas.filter(function(p){ return p.statut==='en_cours'||p.statut==='reporte'; })
    .map(function(p){ return p.id+' : '+p.texte+' (prévu '+quandLib(p)+')'; }).join('\n') || 'aucun';
}
async function lireDiscussion(){
  if(!etat.cle) return;
  const msgs=etat.fil.filter(function(m){ return m.type==='user' || m.type==='agent' || m.type==='pro'; });
  if(msgs.length<=luJusqua) return;
  const users=msgs.slice(luJusqua).filter(function(m){ return m.type==='user'; });
  const avant=luJusqua; luJusqua=msgs.length;
  if(!users.length) return;
  const recents=msgs.slice(-8).map(function(m){ return (m.type==='user'?'Personne':'Accompagnant')+' : '+String(m.texte||'').slice(0,800); }).join('\n');
  const charge='Dossier :\n'+(dossierLignes().join('\n')||'vide')+'\n\nPas en cours :\n'+pasEnCoursListe()
    +'\n\nDerniers échanges :\n'+recents+'\n\nDernier message de la personne, celui que tu lis :\n'+users.map(function(m){ return m.texte; }).join('\n');
  try{
    const res=await appeler(LECTURE_SYSTEM, [{role:'user', content:charge}], 900, {modele:modeleLecture(), sansRelais:true});
    const j=extraireJSON(res.texte);

  }catch(_){ luJusqua=avant; }
}
function appliquerLecture(j){
  const niveau=+j.risque||0;
  if(niveau>=2) declencherCrise(niveau, j.risque_citation||'', 'lecture');
  derniereLecture={phase:j.phase||null, besoin:j.besoin||null, energie:j.energie||null, demande_precise:!!j.demande_precise,
    information_manquante:(INFO_MANQUANTE[j.information_manquante] ? j.information_manquante : null), terrain:(j.terrain && AG[j.terrain]) ? j.terrain : null, at:Date.now()};
  if(j.signal && NOMS_SIGNAUX[j.signal] && typeof poserSignal==='function') poserSignal(j.signal, 'lecture', false, j.signal_preuve);
  (Array.isArray(j.pas_evoques)?j.pas_evoques:[]).forEach(function(x){
    const p=x && pasParId(x.id); if(!p) return;
    if(x.statut==='fait') marquerPasFait(p);
    else if(x.statut==='abandonne') p.statut='abandonne';
    else if(x.statut==='reporte'){ p.statut='reporte'; p.reports=(p.reports||0)+1; p.echeance=Date.now()+2*86400000; p.evoque=0; }
  });
  (Array.isArray(j.faits_nouveaux)?j.faits_nouveaux:[]).slice(0,5).forEach(function(f){ dossierAjouter('faits', f, 40); });
  (Array.isArray(j.a_venir)?j.a_venir:[]).slice(0,3).forEach(function(e){
    if(!e || !e.quoi) return; const d=dossierObj();
    if(d.aVenir.some(function(x){ return x.quoi===e.quoi && x.date===e.date; }) || dossierEfface(e.quoi)) return;
    d.aVenir.push({quoi:String(e.quoi).slice(0,120), date:String(e.date||'').slice(0,10)});
    if(d.aVenir.length>10) d.aVenir=d.aVenir.slice(-10);
  });
  if(j.hypothese_refusee) dossierAjouter('refusees', j.hypothese_refusee, 20);
  if(typeof rendreFil==='function') rendreFil();
}

/* ─────────── 4. le bloc « dossier » envoyé au modèle ─────────── */
function consigneLongueur(){
  const C={tres_court:'longueur : très courte, une ou deux phrases, l’essentiel.',
         court:'longueur : courte et nette, deux phrases la plupart du temps, trois au plus.',
         long:'longueur : tu peux développer quand le sujet le demande, jamais plus de deux paragraphes courts.',
         variable:'longueur : suis le moment. Court quand elle écrit court, plus développé quand elle demande d’expliquer.'};
  return C[cle('longueur')] || 'longueur : trois ou quatre phrases.';
}
function dossierTexte(){
  const r=etat.rep, L=['Dossier de la personne : tout son parcours d’accueil, puis ce que MAYND a appris dans les échanges. À utiliser en silence, sans jamais le réciter.'];
  const p=prenom(); if(p) L.push('prénom : '+p);
  L.push(fem() ? 'accord : la personne est une femme. Accorde au féminin tout ce qui la désigne (« tu es prête », « tu t’es sentie »).'
               : 'accord : adresse-toi à la personne au masculin (« tu es prêt », « tu t’es senti »).');
  L.push('formule : '+(abonne() ? 'MAYND (les seize accompagnants, la voix, la supervision par son professionnel référent)' : 'gratuite (MIA seule, sans accompagnant ni professionnel référent)'));
  if(typeof nomLangueModele==='function' && nomLangueModele()) L.push('langue : l’application est en '+nomLangueModele()+'. Tu écris en '+nomLangueModele()+', même si ce dossier est en français.');
  const pr=profil(); L.push('profil MAYND : '+pr.nom+' — '+pr.desc);
  L.push('');
  L.push('Son compte-rendu, partie par partie. Il est écrit pour elle, à la deuxième personne : « tu », c’est elle. Quand une partie est marquée « corrigée par la personne », sa version fait foi sur tout le reste du dossier.');
  SECTIONS_CR.forEach(function(s){ L.push('« '+s.titre+' »'+(etat.cr.toi[s.id]!=null?' (corrigée par la personne)':'')+' : '+texteSection(s.id).replace(/\s*\n+\s*/g, ' ')); });
  L.push('');
  const ph=String(r.phrase||'').trim(); if(ph) L.push('ce qui l’amène, dans ses mots : « '+ph+' »');
  const items=boussoleItems(); if(items.length) L.push('boussole complète (1 à 10) : '+items.map(function(x){ return x.nom+' '+x.v; }).join(', '));
  const eq=equipe(); if(eq.length) L.push('accompagnants pressentis d’après son parcours : '+eq.join(', '));
  if(etat.presents.length>1) L.push('accompagnants déjà venus dans la discussion : '+etat.presents.filter(function(x){ return x!=='mia'; }).map(function(x){ return AG[x].nom; }).join(', '));
  dossierLignes().forEach(function(x){ L.push(x); });
  if(etat.signaux.length) L.push('signaux déjà transmis à son professionnel référent : '+etat.signaux.map(function(s){ return s.type; }).join(', '));
  if(typeof jeuxFaitsLignes==='function') jeuxFaitsLignes().forEach(function(x){ L.push(x); });
  L.push('');
  L.push('Comment lui parler. Ce sont ses choix : ils priment sur tes habitudes. Si sa version corrigée de « Comment MIA va te parler » dit autre chose, suis sa version.');
  const N={debutant:'elle découvre ces sujets : parle simplement, sans jargon, avec des exemples de la vie de tous les jours.',
           curieux:'elle connaît un peu ces sujets : reste simple ; tu peux nommer une notion si tu l’expliques en une phrase.',
           avance:'elle connaît bien ces sujets : tu peux aller plus loin, avec des outils précis et concrets.',
           accompagne:'elle a déjà été accompagnée : appuie-toi sur ce qu’elle sait déjà, et demande-lui ce qui avait marché.',
           sceptique:'elle n’y croit pas trop : pas de grands mots, du concret, des effets visibles vite.',
           mefiant:'elle se méfie de ce genre d’application : ne demande jamais plus que nécessaire, et dis clairement ce que tu fais de ce qu’elle te confie.'};
  if(N[cle('niveau')]) L.push('- niveau : '+N[cle('niveau')]);
  const f=nombre('franchise'); if(f) L.push('- '+(f<=2 ? 'franchise : en douceur. Tu poses les choses avec précaution, sans jamais les taire.' : f>=4 ? 'franchise : sans détour. Tu dis les choses clairement, jamais brutalement.' : 'franchise : directe, avec tact.'));
  L.push('- '+consigneLongueur());
  const pi=nombre('piste'); if(pi) L.push('- '+(pi<=2 ? 'elle préfère réfléchir : aide-la par des questions justes, une à la fois, plutôt que par des solutions.' : pi>=4 ? 'elle préfère des pistes concrètes : propose vite un pas faisable.' : 'équilibre questions et pistes concrètes.'));
  const H={oui:'humour : un trait léger est bienvenu, jamais sur ce qui fait mal.', tact:'humour : rare et délicat.', apres:'humour : seulement quand elle va mieux, jamais dans un moment difficile.', non:'humour : aucun.'};
  if(H[cle('humour')]) L.push('- '+H[cle('humour')]);
  const R={franche:'relances : quand un pas n’a pas été fait, relance franchement, sans culpabiliser.', douce:'relances : rappelle un pas non fait doucement, une seule fois.',
           comprendre:'relances : quand un pas n’a pas été fait, demande-lui ce qui a bloqué, sans juger.', plus_petit:'relances : quand un pas n’a pas été fait, propose un pas plus petit.',
           silence:'relances : n’évoque jamais un pas non fait, sauf si elle en parle.'};
  if(R[cle('relance')]) L.push('- '+R[cle('relance')]);
  return L.join('\n');
}

<script>
/* ══════════════════════════════════════════════════════════════════════════
   APP MIX — LE PROFESSIONNEL RÉFÉRENT (13/11/2026)
   Décision du porteur du projet : l'accompagnement humain doit être visible.
   - Une carte sur Aujourd'hui : qui il est, ce qu'il a lu, son dernier mot.
   - Il écrit dans la discussion, sur signal seulement (stagnation, blocage,
     désalignement, progression à consolider) : fond vert, badge certifié.
   - Il signe la feuille de route en début de mois et le bilan en fin de mois.
   Jamais de rendez-vous. Libellé exact : « professionnel référent certifié ».
   « Ton professionnel référent » tant qu'aucun nom n'est renseigné.
   Prototype : ses messages sont rédigés par le modèle avec une consigne dédiée,
   marqués pro:true. Les réglages (section Démonstration) le disent ; l'interface
   courante, jamais. Le serveur prévu (docs/serveur.md) donnera la main à un
   vrai professionnel : même format de message, même signaux.
   En gratuit, il n'y a pas de professionnel : aucun signal n'est posé.
   ══════════════════════════════════════════════════════════════════════════ */

const PRO_CONSIGNE=`Tu es le professionnel référent certifié de MAYND : un humain, pas une intelligence artificielle. Tu suis le parcours de cette personne, tu as lu son compte-rendu et ses échanges avec MIA et les accompagnants. Tu n'écris que lorsqu'un signal le justifie, et c'est le cas maintenant.
Ta manière : chaleureuse, sobre, directe. Deux à trois phrases, jamais plus. Tu tutoies. Tu dis ce que tu as vu, ce que tu proposes, et tu laisses la porte ouverte. Tu ne poses pas de rendez-vous : tu es là, tu lis, tu reviens quand c'est utile. Tu ne parles pas à la place de MIA ni des accompagnants. Tu n'es ni médecin ni soignant, et tu ne le laisses jamais entendre : aucun vocabulaire médical ou clinique, aucun diagnostic. Si ce qu'elle vit relève du soin, tu le dis simplement et tu l'invites à consulter un professionnel de santé. Aucune balise, aucune formule toute faite, aucun mot anglais.`;
const PRO_MOTIFS={
  stagnation:"Signal : stagnation. Rien ne bouge depuis plusieurs échanges malgré les pas proposés. Nomme-le sans reproche, propose de réduire la marche, et demande ce qui coince vraiment.",
  blocage:"Signal : blocage. Elle bute sur quelque chose qu'elle ne dépasse pas seule, ou ce qu'elle vit demande un regard humain. Dis que tu as lu, que tu es là, et ce que tu proposes de faire de ton côté.",
  desalignement:"Signal : désalignement. Ses actes s'éloignent de son cap. Rappelle son cap avec ses mots, sans juger, et demande si c'est toujours le bon.",
  progression:"Signal : progression à consolider. Un vrai progrès. Dis précisément ce que tu as vu, et propose comment l'ancrer, sans en rajouter."
};
const SIGNAL_FENETRE=7*86400000;

function poserSignal(type, source, urgent, preuve){
  if(!NOMS_SIGNAUX[type] || !abonne()) return;
  const now=Date.now();
  const deja=etat.signaux.find(function(s){ return s.type===type && now-s.at<SIGNAL_FENETRE; });
  if(deja){ deja.at=now; if(preuve) deja.preuve=String(preuve).slice(0, 220); garder(); return; }
  etat.signaux.push({type:type, at:now, source:source||'', preuve:String(preuve||'').slice(0, 220), repondu:false, urgent:!!urgent});
  if(etat.signaux.length>40) etat.signaux=etat.signaux.slice(-40);
  ajouterAuFil({type:'signal', signal:type});
  if(urgent) proRepondre(etat.signaux[etat.signaux.length-1]);
}
function signalEnAttente(){ return etat.signaux.find(function(s){ return !s.repondu; })||null; }
/* Après chaque réponse d'un accompagnant : si un signal attend, le professionnel écrit. */
function proApresReponse(){ const s=signalEnAttente(); if(s && !enCours) proRepondre(s); }
let proEnCours=false;
async function proRepondre(s){
  if(!s || s.repondu || proEnCours || !etat.cle || !abonne()) return;
  proEnCours=true;
  const tour='Consigne pour ce message :\n'+(PRO_MOTIFS[s.type]||'')+(s.preuve ? '\nCe qui a été lu : « '+s.preuve+' »' : '')
    +(etat.pro.nom ? '\nTu signes de ton prénom : '+etat.pro.nom+'.' : '\nTu ne signes pas : ton nom n’est pas encore renseigné.');
  try{
    const sys=[{type:'text', text:PRO_CONSIGNE, cache_control:{type:'ephemeral'}}, {type:'text', text:dossierTexte(), cache_control:{type:'ephemeral'}}, {type:'text', text:tour}];
    const res=await appeler(sys, messagesPour('pro', {}).concat([{role:'user', content:'(Le professionnel référent intervient sur signal.)'}]).filter(function(m, i, a){ return !(i>0 && m.role===a[i-1].role && m.role==='user' && i===a.length-1 && a[i-1].content.indexOf('(La personne attend')===0); }), 600);
    const texte=res.refus ? '' : lireBalises(res.texte).texte;
    if(texte){
      s.repondu=true; s.reponduLe=Date.now();
      etat.pro.lu=Date.now();
      etat.pro.messages.push({at:Date.now(), signal:s.type, texte:texte});
      if(etat.pro.messages.length>30) etat.pro.messages=etat.pro.messages.slice(-30);
      ajouterAuFil({type:'pro', texte:texte, signal:s.type});
    }
  }catch(_){}
  proEnCours=false;
}

/* ─────────── feuille de route et bilan ─────────── */
function moisLib(d){ return MOIS_FR[d.getMonth()]+' '+d.getFullYear(); }
function axesFeuille(){
  const out=[];
  if(etat.rep.cap) out.push({id:'mia', tx:'Garder le cap : '+cite(etat.rep.cap)+'.'});
  const venus=etat.presents.filter(function(x){ return x!=='mia'; }), pressentis=equipe().filter(function(x){ return venus.indexOf(x)<0; });
  venus.slice(0, 2).forEach(function(id){ out.push({id:id, tx:'Avancer avec '+AG[id].nom+' sur '+minus(AG[id].domaine)+'.'}); });
  pressentis.slice(0, Math.max(0, 3-out.length)).forEach(function(id){ out.push({id:id, tx:'Rencontrer '+AG[id].nom+', sur '+minus(AG[id].domaine)+'.'}); });
  if(!out.length) out.push({id:'mia', tx:'Poser un premier cap avec MIA.'});
  return out.slice(0, 3);
}
function feuilleDuMois(){
  const m=cleMois();
  let f=etat.pro.feuilles.find(function(x){ return x.mois===m; });
  if(!f){ f={mois:m, axes:axesFeuille(), signee:0}; etat.pro.feuilles.push(f); if(etat.pro.feuilles.length>12) etat.pro.feuilles=etat.pro.feuilles.slice(-12); garder(); }
  return f;
}
function bilanPrecedent(){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  const m=cleMois(d);
  return etat.pro.bilans.find(function(x){ return x.mois===m; })||null;
}
function prochaineEcheance(){
  const now=new Date(), f=feuilleDuMois();
  if(!f.signee){ return 'Feuille de route de '+MOIS_FR[now.getMonth()]+' : en préparation.'; }
  const fin=new Date(now.getFullYear(), now.getMonth()+1, 0);
  return 'Bilan de '+MOIS_FR[now.getMonth()]+' : le '+fin.getDate()+' '+MOIS_FR[fin.getMonth()]+'.';
}
function proCarteHTML(){
  if(!abonne()){
    return '<div class="bloc carte-pro"><div class="qui"><span class="av pro">'+badgePro()+'</span><div><strong>Professionnel référent certifié</strong><span>Inclus dans MAYND</span></div></div>'
      +'<p>Un humain qui lit ton parcours, signe ta feuille de route et intervient quand un signal le justifie. Sans rendez-vous.</p>'
      +'<button class="lien" data-action="formule-ouvrir" data-raison="pro">Découvrir ma supervision</button></div>';
  }
  const dernier=etat.pro.messages[etat.pro.messages.length-1];
  const lu=etat.pro.lu ? 'A lu ton parcours '+dateLib(etat.pro.lu)+'.' : 'Lit ton parcours.';
  return '<div class="bloc carte-pro"><div class="qui"><span class="av pro">'+badgePro()+'</span><div><strong>'+esc(nomPro())+'</strong><span>Professionnel référent certifié · '+esc(lu)+'</span></div></div>'
    +(dernier ? '<div class="mot">« '+esc(dernier.texte.length>160 ? dernier.texte.slice(0, 157).trim()+'…' : dernier.texte)+' »</div>' : '<p>Il intervient dans ta discussion quand un signal le justifie. Sans rendez-vous.</p>')
    +'<div class="prochain">'+esc(prochaineEcheance())+'</div>'
    +'<button class="lien" data-action="pro-ouvrir">Ma feuille de route et mon bilan</button></div>';
}
function proPanneauHTML(){
  if(!abonne()) return '<h2>Ton professionnel référent</h2><p>Un professionnel référent certifié suit le parcours de chaque abonné MAYND. Il lit, il signe ta feuille de route et ton bilan, et il intervient dans ta discussion quand un signal le justifie. Sans rendez-vous.</p>'+bouton('Découvrir MAYND', 'formule-ouvrir', ' data-raison="pro"');
  const f=feuilleDuMois(), b=bilanPrecedent(), now=new Date();
  let hh='<div class="fiche-tete"><span class="av pro">'+badgePro()+'</span><div><strong>'+esc(nomPro())+'</strong><span>Professionnel référent certifié</span></div></div>'
    +'<p class="petit">Il lit ton parcours, ajuste ta feuille de route et t’écrit quand c’est utile. Tu n’as jamais de rendez-vous à prendre.</p>'
    +'<p class="titre-section">Feuille de route · '+esc(MOIS_FR[now.getMonth()])+'</p><div class="bloc">'
    +f.axes.map(function(a){ return '<p>'+avatar(a.id, 'petit')+' '+esc(a.tx)+'</p>'; }).join('')
    +(f.signee ? '<p class="petit">Signée le '+esc(dateCourte(f.signee))+' par '+esc(nomPro())+'.</p>' : '<p class="petit">En préparation. Elle part à la signature au début du mois.</p>')+'</div>';
  hh+='<p class="titre-section">Bilan · '+esc(MOIS_FR[(now.getMonth()+11)%12])+'</p><div class="bloc">'
    +(b ? '<p>'+esc(b.texte)+'</p><p class="petit">Relu et signé le '+esc(dateCourte(b.signee))+'.</p>' : '<p class="petit">Le bilan se fait en fin de mois, à partir de ton compte-rendu, de tes pas et de tes échanges. Ta boussole te sera proposée juste avant.</p>')+'</div>';
  hh+='<p class="titre-section">Signaux</p><div class="bloc">'
    +(etat.signaux.length ? etat.signaux.slice(-6).reverse().map(function(s){ return '<p><strong>'+esc(majus(NOMS_SIGNAUX[s.type]))+'</strong> · '+esc(dateLib(s.at))+(s.repondu ? ' · il t’a écrit' : ' · il te lit')+'</p>'; }).join('')
      : '<p class="petit">Aucun signal pour l’instant. Il intervient en cas de stagnation, de blocage, de désalignement, ou pour consolider une progression.</p>')+'</div>';
  if(etat.pro.messages.length) hh+='<p class="titre-section">Ses messages</p><div class="pile">'+etat.pro.messages.slice(-5).reverse().map(function(m){ return '<div class="bloc carte-pro"><span class="sur">'+esc(dateLib(m.at))+'</span><p>'+esc(m.texte)+'</p></div>'; }).join('')+'</div>';
  return hh;
}
ACTIONS['pro-ouvrir']=function(){ ouvrir(proPanneauHTML()); };

/* ─────────── démonstration : signer en tant que professionnel ─────────── */
ACTIONS['demo-signer-feuille']=function(){ const f=feuilleDuMois(); f.signee=Date.now(); etat.pro.lu=Date.now(); garder(); toast('Feuille de route signée.'); rafraichirOnglet(); };
ACTIONS['demo-signer-bilan']=function(){
  const d=new Date(); d.setDate(1); d.setMonth(d.getMonth()-1);
  const m=cleMois(d); if(etat.pro.bilans.some(function(x){ return x.mois===m; })) return;
  const pas=dossierObj().pas, faits=pas.filter(function(p){ return p.statut==='fait'; }).length;
  const texte='Profil '+profil().nom+'. Cap : « '+cite(etat.rep.cap||'à poser')+' ». '+pluriel(pas.length, 'pas posé', 'pas posés')+', '+pluriel(faits, 'fait', 'faits')+'. '
    +(etat.presents.length>1 ? 'Accompagnants rencontrés : '+etat.presents.filter(function(x){ return x!=='mia'; }).map(function(x){ return AG[x].nom; }).join(', ')+'.' : 'Pas encore d’accompagnant rencontré.');
  etat.pro.bilans.push({mois:m, texte:texte, signee:Date.now()}); etat.pro.lu=Date.now(); garder(); toast('Bilan signé.'); rafraichirOnglet();
};
ACTIONS['demo-pro-nom']=function(){ const i=document.getElementById('demo-pro-nom'); etat.pro.nom=String(i && i.value || '').trim().slice(0, 40); garder(); toast(etat.pro.nom ? 'Nom enregistré.' : 'Nom retiré.'); };

</script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   APP MIX — LE MOTEUR DES JEUX (13/11/2026)
   Un seul moteur pour les dix-sept jeux de 02-donnees-jeux.js, réécrit à plat
   à partir de MAYND (18, 24, 27, 28, 31, 33) : question préalable (q0), sous-
   question qui peut fermer le jeu (q0b), branche courte, branche irrégulière,
   « Autre » avec texte libre, sorties qui dépendent du contexte (Miro, MIA),
   arrêt anticipé de Nora, point de mesure de MIA.
   Fin d'un jeu (décision du 30/09/2026) : pas de résumé qui répète, pas de
   renvoi vers un autre accompagnant. Deux boutons : « En parler avec X
   maintenant » (le récapitulatif part dans la discussion, X répond en sachant
   qu'on sort de son jeu, et fait venir qui est utile) et « Ce que X peut
   vraiment faire pour toi » (sa fiche). Finir un jeu réveille la voix de X.
   En gratuit, les jeux sont ouverts : c'est la façon douce de rencontrer un
   accompagnant. Mais c'est MIA qui en parle, puisque les accompagnants font
   partie de l'abonnement.
   ══════════════════════════════════════════════════════════════════════════ */

const THEME_PAR_AGENT={}; Object.keys(JEUX).forEach(function(k){ THEME_PAR_AGENT[JEUX[k].agent]=k; });
const REFLEXION_MS=DUREE ? 10000 : 0;
let partie=null, reflexionTimer=null, finDePartie=null;

/* ─────────── disponibilité et mémoire ─────────── */
function runsDe(theme){ return etat.jeux.runs.filter(function(r){ return r.theme===theme; }); }
function runsTermines(theme){ return runsDe(theme).filter(function(r){ return r.completed; }); }
function jeuxTerminesDistincts(){ const s={}; etat.jeux.runs.forEach(function(r){ if(r.completed && r.theme!=='point') s[r.theme]=1; }); return Object.keys(s).length; }
function jeuPointDisponible(){ return etat.pro.bilans.length>0 || jeuxTerminesDistincts()>=3; }
function jeuDe(id){
  const t=THEME_PAR_AGENT[id]; if(!t) return null;
  if(id==='mia' && !jeuPointDisponible()) return null;
  return t;
}
function jeuxFaitsLignes(){
  const L=[];
  etat.jeux.runs.filter(function(r){ return r.completed; }).slice(-4).forEach(function(r){
    const g=JEUX[r.theme]; if(!g) return;
    const rep=Object.keys(r.answers).map(function(k){ return r.answers[k]; }).join(' ; ');
    L.push('jeu « '+g.label+' » de '+AG[g.agent].nom+', fait '+dateLib(r.at)+' : '+rep);
  });
  return L;
}

/* ─────────── la définition d'une question, selon le contexte ─────────── */
function neoRemplir(str){
  if(typeof str!=='string') return str;
  const a=partie && partie.answers.q0, s=(a && a.sujet) ? a.sujet : NEO_SANS_SUJET;
  return str.replace(/\{sans\}/g, s.sans).replace(/\{place\}/g, s.place).replace(/\{prend\}/g, s.prend).replace(/\{mot\}/g, s.mot);
}
function questionDef(step){
  const g=JEUX[partie.theme]; let q;
  if(step==='shortQ1') q=g.short.q1;
  else if(step==='shortQ2') q=g.short.q2;
  else if(step==='q3' && partie.branch==='irregular') q=Object.assign({}, g.q3, {title:g.q3.titleIrregular});
  else if(step==='q2' && partie.theme==='corps' && partie.answers.q0 && NORA_FOOD_Q0.indexOf(partie.answers.q0.label)>=0) q=g.q2Food;
  else if(step==='q4' && partie.theme==='point' && !runsTermines('point').length) q=g.q4First;
  else q=g[step];
  if(!q) return null;
  if(partie.theme!=='habitudes') return q;
  const c=Object.assign({}, q);
  ['title','titleIrregular'].forEach(function(k){ if(c[k]) c[k]=neoRemplir(c[k]); });
  if(c.options) c.options=c.options.map(function(o){ const x=Object.assign({}, o); if(x.restit) x.restit=neoRemplir(x.restit); return x; });
  if(c.dropout){ c.dropout=Object.assign({}, c.dropout); if(c.dropout.restit) c.dropout.restit=neoRemplir(c.dropout.restit); }
  return c;
}
function ordre(){
  const g=JEUX[partie.theme];
  let pre=g.q0 ? ['q0'] : [];
  if(partie.answers.q0 && partie.answers.q0.sub) pre=pre.concat(['q0b']);
  if(partie.skipQ2) return pre.concat(['q1','q3','q4','q5','fin']);
  return pre.concat(partie.branch==='short' ? ['q1','q2','shortQ1','shortQ2','fin'] : ['q1','q2','q3','q4','q5','fin']);
}
function numeroDe(step){ return {q1:'Question 1', q2:'Question 2', q3:'Question 3', q4:'Question 4', q5:'Question 5', shortQ1:'Question 3', shortQ2:'Question 4'}[step] || 'Avant de commencer'; }
function autreAutorise(step, q){
  if(!q || step==='q0b') return false;
  if((q.options||[]).some(function(o){ return /^Autre/i.test(o.label||'') || o.close; })) return false;
  return true;
}

/* ─────────── sorties qui dépendent du contexte ─────────── */
function solDejaVu(){ return rencontre('sol') || etat.jeux.runs.some(function(r){ return r.exitAgent==='sol'; }); }
function quelquunPartageLeLit(){ const r=runsDe('relation').filter(function(x){ return x.answers && x.answers.q0; }); return r.length ? r[r.length-1].answers.q0==='En couple' : false; }
function miaRelationsAgent(){
  let best=null, at=0;
  [['relation','leo'],['affirmation','otis'],['lien','iris']].forEach(function(p){ runsTermines(p[0]).forEach(function(r){ if(r.at>at){ at=r.at; best=p[1]; } }); });
  return best || 'iris';
}
function sortieDe(opt, step){
  if(!opt) return null;
  if(partie.theme==='sommeil' && step==='q3'){
    if(opt.label==='Ma tête qui tourne') return solDejaVu() ? 'sol' : 'felix';
    if(/^Ce qui m'entoure/.test(opt.label)) return quelquunPartageLeLit() ? 'leo' : 'miro';
  }
  if(partie.theme==='point' && step==='q3' && opt.exitRelations) return miaRelationsAgent();
  return opt.exit || null;
}

/* ─────────── l'écran plein ─────────── */
function pleinJeu(html){
  const pl=document.getElementById('plein'), a=AG[partie.agent];
  pl.innerHTML=typo('<div class="jeu" style="--c:'+a.couleur+';--e:'+(a.encre||'#FFFFFF')+';--t:'+teinteDe(a.couleur)+'">'+html+'</div>');
  pl.classList.add('ouvert'); pl.setAttribute('aria-hidden', 'false'); pl.scrollTop=0;
  if(fem()) accordNoeud(pl);
}
function accordNoeud(root){
  const w=document.createTreeWalker(root, NodeFilter.SHOW_TEXT, null); let n; const l=[];
  while((n=w.nextNode())) l.push(n);
  l.forEach(function(t){ if(!t.parentElement.closest('textarea')){ const v=accordFeminin(t.nodeValue); if(v!==t.nodeValue) t.nodeValue=v; } });
}
function barreJeu(step){
  const o=ordre(), i=Math.max(0, o.indexOf(step)), pct=Math.round(100*i/Math.max(1, o.length-1));
  return '<header class="barre"><span class="sur">'+esc(AG[partie.agent].nom)+' · '+esc(JEUX[partie.theme].label)+'</span>'
    +'<div class="progression" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="'+pct+'"><span style="width:'+pct+'%"></span></div>'
    +'<button class="b-quitter" data-action="jeu-quitter">Quitter</button></header>';
}
function ouvrirJeu(agentId){
  const theme=jeuDe(agentId); if(!theme) return;
  clearTimeout(reflexionTimer);
  partie={theme:theme, agent:agentId, branch:null, step:JEUX[theme].q0 ? 'q0' : 'q1', answers:{}, titles:{}, skipQ2:false, dejaReveille:voixReveillee(agentId)};
  rendreEtape();
}
function rendreEtape(){
  if(partie.step==='fin'){ rendreFin(); return; }
  rendreQuestion(partie.step);
}
function rendreQuestion(step){
  clearTimeout(reflexionTimer);
  const g=JEUX[partie.theme], q=questionDef(step);
  const opts=q.options.map(function(o, i){ return '<button class="opt" data-action="jeu-choix" data-step="'+step+'" data-i="'+i+'">'+esc(o.label)+'</button>'; }).join('')
    +(autreAutorise(step, q) ? '<button class="opt" data-action="jeu-autre">Autre</button><div class="autre" id="jeu-autre" hidden><textarea class="champ" id="jeu-autre-texte" rows="2" maxlength="280" placeholder="Ce qui est juste pour toi, si tu veux l’écrire"></textarea><button class="btn" data-action="jeu-choix" data-step="'+step+'" data-i="autre">Valider</button></div>' : '')
    +(q.dropout ? '<button class="lien" data-action="jeu-choix" data-step="'+step+'" data-i="-1">'+esc(q.dropout.label)+'</button>' : '');
  const ms=(g.reflectionMs && REFLEXION_MS) ? REFLEXION_MS : 0;
  pleinJeu(barreJeu(step)+'<div class="corps"><p class="sur">'+esc(numeroDe(step))+'</p>'
    +(ms ? '<div class="reflexion" id="jeu-reflexion"><div class="monte" style="--d:'+(ms/1000)+'s"></div><h1 class="q-titre">'+esc(q.title)+'</h1></div>'
         : '<h1 class="q-titre">'+esc(q.title)+'</h1>')
    +'<div class="options" id="jeu-options"'+(ms?' hidden':'')+'>'+opts+'</div>'
    +(ms && !g.noClock ? '<button class="lien" id="jeu-voir" data-action="jeu-voir">Voir les réponses maintenant</button>' : '')+'</div>');
  if(ms) reflexionTimer=setTimeout(montrerOptions, ms);
}
function montrerOptions(){
  clearTimeout(reflexionTimer);
  const o=document.getElementById('jeu-options'), b=document.getElementById('jeu-voir'), r=document.getElementById('jeu-reflexion');
  if(o) o.hidden=false; if(b) b.hidden=true; if(r) r.classList.add('fini');
}
function choisirJeu(step, idx){
  const q=questionDef(step); if(!q) return;
  let opt;
  if(idx==='autre'){
    const tx=document.getElementById('jeu-autre-texte'), text=tx ? String(tx.value||'').trim().slice(0, 280) : '';
    opt={label:'Autre', text:text, autre:true, branch:'normal', restit:''};
  } else opt=idx===-1 ? q.dropout : q.options[idx];
  if(!opt) return;
  partie.titles[step]=q.title;
  partie.answers[step]=opt;
  if(step==='q0' && opt.direct && AG[opt.direct]){ partie.exitAgent=opt.direct; terminer(true); return; }
  if(step==='q0b'){
    if(opt.close){ terminer(true); rendreFerme(); return; }
    if(opt.skipToIrregular){ partie.branch='irregular'; partie.skipQ2=true; }
  }
  if(step==='q2') partie.branch=opt.branch||'normal';
  if(step==='q3') partie.exitAgent=sortieDe(opt, step);
  if(partie.theme==='corps' && (step==='q2' || (step==='q1' && partie.skipQ2)) && noraDoitArreter()){ noraArreter(); return; }
  const o=ordre(), i=o.indexOf(step);
  partie.step=o[i+1]||'fin';
  if(partie.step==='fin') terminer(true);
  rendreEtape();
}
function reponsesPourMemoire(){
  const out={};
  Object.keys(partie.answers).forEach(function(k){ const a=partie.answers[k]; out[k]=a.autre ? ('Autre'+(a.text?' : '+a.text:'')) : a.label; });
  return out;
}
function terminer(complet){
  const run={theme:partie.theme, agent:partie.agent, at:Date.now(), branch:partie.branch, answers:reponsesPourMemoire(), exitAgent:partie.exitAgent||null, completed:!!complet, stopped:!!partie.stopped};
  if(partie.theme==='point'){ run.terrain=(partie.branch!=='short' && partie.answers.q3 && partie.answers.q3.terrain)||null; run.state=partie.answers.q2 ? partie.answers.q2.label : null; }
  etat.jeux.runs.push(run); if(etat.jeux.runs.length>120) etat.jeux.runs=etat.jeux.runs.slice(-120);
  if(complet || partie.stopped){
    if(etat.voix.reveillees.indexOf(partie.agent)<0) etat.voix.reveillees.push(partie.agent);
    signauxDesJeux();
  }
  garder();
  if(complet && typeof proApresReponse==='function' && jeuPointDisponible()) rafraichirOnglet();
}
function abandonner(){
  clearTimeout(reflexionTimer);
  if(partie && partie.step!=='fin' && Object.keys(partie.answers).length) terminer(false);
  fermerJeu();
}
function fermerJeu(){ partie=null; fermerPlein(); }

/* ─────────── Nora : l'arrêt anticipé ─────────── */
function noraDoitArreter(){
  const a=partie.answers;
  const durable=a.q1 && NORA_DURABLE.indexOf(a.q1.label)>=0;
  if(!durable) return false;
  if(partie.skipQ2) return true;
  return !!(a.q2 && NORA_FORT.indexOf(a.q2.label)>=0);
}
function noraArreter(){
  clearTimeout(reflexionTimer);
  partie.stopped=true; partie.step='fin';
  terminer(false);
  pleinJeu(barreJeu('fin')+'<div class="corps fin"><h1 class="grand">Merci d’avoir répondu.</h1>'
    +'<p class="texte">On s’arrête là pour ce jeu : ce que tu décris mérite mieux que des questions à choix.</p>'
    +'<p class="texte">En parler à quelqu’un peut aider, à ton rythme. '+(abonne() ? 'Ton professionnel référent te lit, sans rendez-vous.' : 'Une personne de confiance, ou un professionnel de santé, peut t’écouter.')+'</p>'
    +(abonne() ? bouton('Voir mon professionnel référent', 'jeu-pro') : '')

}
function rendreFerme(){
  pleinJeu(barreJeu('fin')+'<div class="corps fin"><h1 class="grand">Merci d’avoir répondu.</h1><p class="texte">On s’arrête là.</p>'+bouton('Fermer', 'jeu-quitter')+'</div>');
}

/* ─────────── signaux des jeux (31-jeu-nora-et-signaux.js) ─────────── */
function signauxDesJeux(){
  if(typeof poserSignal!=='function') return;
  const lim=Date.now()-30*86400000;
  const recents=function(theme){ return runsDe(theme).filter(function(r){ return r.at>=lim; }); };
  if(recents('corps').some(function(r){ return r.stopped; })) poserSignal('blocage', 'jeu de Nora', true, 'Le jeu de Nora s’est arrêté avant la fin et a orienté vers un accompagnement humain.');
  if(recents('habitudes').some(function(r){ const a=r.answers||{}; return r.completed && ["C'est tous les jours","J'ai du mal à m'arrêter une fois lancé"].indexOf(a.q2)>=0 && ["Il y a plus d'un an",'Je ne sais plus'].indexOf(a.q1)>=0; }))
    poserSignal('blocage', 'jeu de Neo', false, 'Ce qui prend de la place est présent chaque jour, ou difficile à arrêter, depuis longtemps.');
  const rep=function(theme, q2){ return runsTermines(theme).filter(function(r){ return r.answers && r.answers.q2===q2; }).length; };
  if(rep('travail', 'Trop de charge, je ne tiens plus le rythme')>=2) poserSignal('blocage', 'jeu de Mateo', false, '« Trop de charge, je ne tiens plus le rythme », à plusieurs passages.');
  if(rep('lien', "Je n'ai plus personne à appeler")>=2) poserSignal('blocage', 'jeu d’Iris', false, '« Je n’ai plus personne à appeler », à plusieurs passages.');
  const pts=runsTermines('point').slice(-3);
  if(pts.length===3 && pts.every(function(r){ return r.state==='Je stagne'; })) poserSignal('stagnation', 'point de mesure', false, 'Trois points de mesure de suite sur « je stagne ».');
}

/* ─────────── la fin ─────────── */
function infosFin(){
  const g=JEUX[partie.theme], A=partie.answers, court=partie.branch==='short';
  const utiles=[];
  function add(id){ if(id && id!=='mia' && id!==partie.agent && AG[id] && utiles.indexOf(id)<0) utiles.push(id); }
  add(partie.exitAgent);
  ['q0','q2','q3'].forEach(function(k){ const a=A[k]; if(a && a.second && !(k==='q3' && court)) add(a.second); });
  add(g.alsoAlways);
  const rangs=['q0','q0b','q1','q2','q3','q4','q5','shortQ1','shortQ2'];
  const lignes=Object.keys(A).filter(function(k){ return rangs.indexOf(k)>=0; }).sort(function(a, b){ return rangs.indexOf(a)-rangs.indexOf(b); })
    .map(function(k){ const a=A[k]; return {q:partie.titles[k]||'', a:a.autre ? (a.text||'Autre') : a.label}; });
  return {theme:partie.theme, label:g.label, agent:partie.agent, utiles:utiles.slice(0, 2), lignes:lignes, reveil:!partie.dejaReveille, stopped:!!partie.stopped,
    revoirCap:!!(partie.theme==='point' && A.q5 && A.q5.reviewObjective), comparaison:partie.theme==='point' ? comparaisonPoint() : ''};
}
function comparaisonPoint(){
  if(partie.branch==='short') return '';
  const now=partie.answers.q3; if(!now || !now.terrain) return '';
  const runs=runsTermines('point'); let prev=null;
  for(let i=runs.length-2;i>=0;i--){ if(runs[i].terrain){ prev=runs[i]; break; } }
  if(!prev || prev.terrain===now.terrain) return '';
  return majus(dateLib(prev.at))+', tu situais ça du côté '+MIA_TERRAIN[prev.terrain].phrase+'. Aujourd’hui, '+MIA_TERRAIN[now.terrain].auj+'.';
}
function rendreFin(){
  const e=finDePartie=infosFin(), a=AG[e.agent], pr=pron(e.agent), nom=esc(a.nom), n=e.lignes.length;
  const corps=e.agent==='mia'
    ? 'MIA a tes '+n+' réponses. Si tu veux voir ce qu’elles disent de ton parcours, elle les lit et te répond tout de suite. Pas besoin de tout réécrire.'
    : nom+' a tes '+n+' réponses. Si tu as besoin d’en parler, c’est exactement ce pour quoi '+pr.il+' est là : '+pr.il+' les lit et te répond tout de suite. Pas besoin de tout réécrire.';
  const parler=e.agent==='mia' || abonne() ? 'En parler avec '+nom+' maintenant' : 'En parler avec MIA maintenant';
  const prec=runsTermines(e.theme).slice(0, -1).pop();
  pleinJeu(barreJeu('fin')+'<div class="corps fin">'
    +'<div class="fiche-tete">'+avatar(e.agent, 'grand')+'<div><strong>'+nom+'</strong><span>'+esc(e.label)+'</span></div></div>'
    +'<h1 class="grand">Merci d’avoir pris ce temps.</h1><p class="texte">'+corps+'</p>'
    +(e.comparaison ? '<p class="texte">'+esc(e.comparaison)+'</p>' : '')
    +(e.reveil && abonne() && voixReveillee(e.agent) ? '<button class="voix-reveil" data-action="voix-echantillon" data-id="'+e.agent+'">'+iconeVoix()+'<span>Tu as réveillé la voix de '+nom+'. L’écouter</span></button>' : '')
    +(e.revoirCap ? bouton('Revoir mon cap', 'jeu-revoir-cap') : '')
    +bouton(parler, 'jeu-parler')
    +(e.agent==='mia' ? '' : '<button class="btn clair" data-action="jeu-fiche" data-id="'+e.agent+'">Ce que '+nom+' peut vraiment faire pour toi</button>')
    +'<details class="carte"><summary>Revoir mes réponses</summary><ul class="recap">'+e.lignes.map(function(r){ return '<li><strong>'+esc(r.q)+'</strong><br>'+esc(r.a)+'</li>'; }).join('')+'</ul></details>'
    +(prec ? '<details class="carte"><summary>Mes réponses du '+esc(dateCourte(prec.at))+'</summary><ul class="recap">'+Object.keys(prec.answers).map(function(k){ return '<li>'+esc(prec.answers[k])+'</li>'; }).join('')+'</ul></details>' : '')
    +'<button class="lien" data-action="jeu-quitter">Fermer</button></div>');
}
function recapJeu(e){ return 'Je viens de finir ton jeu « '+e.label+' ». Mes réponses :\n\n'+e.lignes.map(function(r){ return '• '+r.q+'\n→ '+r.a; }).join('\n'); }
function consigneFinJeu(e, qui){
  const a=AG[e.agent];
  let s=qui===e.agent
    ? 'Contexte : la personne vient de terminer ton jeu « '+e.label+' », une série de questions à choix. Son dernier message contient ses réponses exactes, envoyées en un geste depuis la fin du jeu. Réponds comme quelqu’un qui a vraiment lu : ne récite pas ses réponses, relie-les. Dis en une ou deux phrases ce que tu y lis, comme une hypothèse ouverte, jamais comme un verdict ni une étiquette. Puis une seule question, pour avancer à partir de là. Une réponse « Autre », avec ou sans texte, compte autant que les autres ; « Je ne sais pas » est une information, pas un manque.'
    : 'Contexte : la personne vient de terminer le jeu « '+e.label+' » de '+a.nom+', une série de questions à choix. Son dernier message contient ses réponses exactes. En formule gratuite, '+a.nom+' ne peut pas venir : c’est toi, MIA, qui réponds. Relie ses réponses en une ou deux phrases, comme une hypothèse ouverte, puis une seule question. Tu peux dire que '+a.nom+' travaillerait ça avec elle dans la formule MAYND, en une phrase, sans insister.';
  if(e.stopped) s+=' Le jeu s’est arrêté avant la fin, parce que ce qu’elle décrit demande un regard humain : dis-le simplement, reste présent, et propose d’en parler à son rythme.';
  if(qui===e.agent && e.utiles.length && abonne() && qui==='mia') s+=' D’après ses réponses, un autre accompagnant pourrait être utile : '+e.utiles.map(function(id){ return AG[id].nom+' ('+minus(AG[id].domaine)+', balise [[INVITE:'+id+']])'; }).join(' ; ')+'. Si, et seulement si, ce que tu lis relève vraiment de son terrain, propose-le et termine par sa balise.';
  else if(qui===e.agent && e.utiles.length) s+=' D’après ses réponses, '+e.utiles.map(function(id){ return AG[id].nom+' ('+minus(AG[id].domaine)+')'; }).join(' et ')+' pourrait être utile : si c’est vraiment le cas, dis-le simplement, MIA s’en chargera.';
  return s;
}
async function parlerDuJeu(){
  const e=finDePartie; if(!e) return;
  fermerJeu();
  const qui=(e.agent==='mia' || abonne()) ? e.agent : 'mia';
  montrerOnglet('discussion');
  setTimeout(function(){
    ajouterAuFil({type:'user', texte:recapJeu(e)});
    if(qui!=='mia' && etat.presents.indexOf(qui)<0) faireVenir(qui, {finJeu:consigneFinJeu(e, qui)});
    else { etat.actif=qui; garder(); rendrePresents(); reponse(qui, {finJeu:consigneFinJeu(e, qui)}); }
  }, DUREE+60);
}
function iconeVoix(){ return '<svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/></svg>'; }

/* ─────────── actions ─────────── */
ACTIONS['jeu-ouvrir']=function(b){ fermer(); ouvrirJeu(b.dataset.id); };
ACTIONS['jeu-choix']=function(b){ if(!partie || partie.step!==b.dataset.step) return; choisirJeu(b.dataset.step, b.dataset.i==='autre' ? 'autre' : +b.dataset.i); };
ACTIONS['jeu-autre']=function(b){ const a=document.getElementById('jeu-autre'); if(a){ a.hidden=false; b.hidden=true; document.getElementById('jeu-autre-texte').focus(); } };
ACTIONS['jeu-voir']=montrerOptions;
ACTIONS['jeu-quitter']=function(){ if(partie && partie.step==='fin') fermerJeu(); else abandonner(); };
ACTIONS['jeu-parler']=function(){ if(!finDePartie && partie) finDePartie=infosFin(); parlerDuJeu(); };
ACTIONS['jeu-fiche']=function(b){ const id=b.dataset.id; fermerJeu(); ACTIONS.fiche({dataset:{id:id}}); };
ACTIONS['jeu-pro']=function(){ fermerJeu(); ACTIONS['pro-ouvrir'](); };
ACTIONS['jeu-revoir-cap']=function(){ fermerJeu(); ACTIONS['cap-modifier'](); };

</script>
<script>
/* ══════════════════════════════════════════════════════════════════════════
   APP MIX — LA VOIX (13/11/2026)
   Repris de MAYND (36-voix-prete.js). Une fiche de voix par accompagnant, une
   doublure du navigateur réglée différemment pour chacun en attendant le
   fournisseur, un serveur avec cache audio, un décompte par mois.
   Finir le jeu d'un accompagnant réveille sa voix (40-jeux.js). Elle s'écoute

   La conversation orale se fera en messages vocaux, jamais en appel.
   Pour brancher : VOICE_ENDPOINT (un serveur, jamais la clé du fournisseur

  leo:  {fiche:'Voix masculine, chaude, registre médium. Débit moyen, ton d’égal à égal.', doublure:{hauteur:1.0, debit:0.98}},

  miro: {fiche:'Voix masculine, très douce et feutrée. Débit lent, une voix du soir.', doublure:{hauteur:0.9, debit:0.84}},

  mateo:{fiche:'Voix masculine, nette et professionnelle. Débit moyen, précise.', doublure:{hauteur:0.98, debit:1.02}},

  neo:  {fiche:'Voix masculine, jeune et directe. Simple, jamais moralisatrice.', doublure:{hauteur:1.1, debit:1.03}},
  nora: {fiche:'Voix féminine, douce et ancrée. Débit lent, ton tranquille.', doublure:{hauteur:1.0, debit:0.92}}
};
/* Voix choisies par le porteur du projet chez Cartesia (choix en cours depuis le 13/11/2026, docs/voix.md). */
const VOIX_CHOISIES={
  mia:  {nom:'Inès', voiceId:'7c58f4a4-a72c-42fa-a503-41b9408820f3'},
  naoki:{nom:'Gerard', voiceId:'5deeaea9-c3cf-4288-82ec-22d8f04eb158'},
  felix:{nom:'Vincent', voiceId:'80e11491-2d8a-4361-ac61-c4f3e0a4f7e7'},
  ava:  {nom:'Solène', voiceId:null},
  leo:  {nom:'Friendly French Man', voiceId:'ab7c61f5-3daa-47dd-a23b-4ac0aac5f5c3'}
};
function voixConfiguree(id){ return !!(VOICE_ENDPOINT && VOIX_CHOISIES[id] && VOIX_CHOISIES[id].voiceId); }
/* Une voix se réveille avec son accompagnant, jamais en gratuit. MIA a toujours la sienne. */
function voixReveillee(id){ return abonne() && (id==='mia' || etat.voix.reveillees.indexOf(id)>=0); }
function voixEchantillon(id){ const i=AGENT_INFO[id]; return i && i.tag ? i.tag : APPORTS[id] || ''; }

/* ─────────── usage ─────────── */
function voixUsage(){
  let u=etat.voix.usage;
  if(!u || u.mois!==cleMois()) u=etat.voix.usage={mois:cleMois(), serveur:0, navigateur:0};
  return u;
}
function voixCompter(moteur, n){ const u=voixUsage(); u[moteur]=(u[moteur]||0)+n; garder(); }
function voixPlafondAtteint(){ const p=VOICE_CONFIG.plafondCaracteresMois; return !!(p && voixUsage().serveur>=p); }
function voixTexte(s){ return String(s||'').replace(/\[\[[^\]]*\]\]?/g, ' ').replace(/[*_#>`~]/g, ' ').replace(/[\u{1F000}-\u{1FAFF}\u{2600}-\u{27BF}\u{FE0F}]/gu, '').replace(/\s+/g, ' ').trim(); }

/* ─────────── la doublure du navigateur ─────────── */
function voixNavDisponible(){ return typeof window!=='undefined' && !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance==='function'; }
const VOIX_NOMS_F=/(denise|eloise|éloise|julie|hortense|amelie|amélie|audrey|aurelie|aurélie|marie|celine|céline|léa|chantal|virginie|sylvie|caroline|brigitte|yvette|coralie|charline|jacqueline|joséphine|josephine|vivienne|female|femme)/i;
const VOIX_NOMS_M=/(henri|paul|thomas|claude|nicolas|daniel|jean|alain|antoine|rémy|remy|guillaume|gérard|gerard|maurice|fabrice|jérôme|jerome|yves|alexandre|male|homme)/i;
function voixNavChoisir(id){
  let toutes=[]; try{ toutes=window.speechSynthesis.getVoices()||[]; }catch(_){}
  let fr=toutes.filter(function(v){ return /^fr([-_]|$)/i.test(v.lang||''); });
  if(!fr.length) return null;
  const locales=fr.filter(function(v){ return v.localService; }); if(locales.length) fr=locales;
  const f=agentFem(id);

let voixBoutonActif=null, voixAudio=null;
function voixFin(){ if(voixBoutonActif){ voixBoutonActif.classList.remove('playing'); voixBoutonActif=null; } }
function voixArreter(){

  try{ if(voixNavDisponible()) window.speechSynthesis.cancel(); }catch(_){}

}
function voixNavigateur(id, texte){

    const u=new window.SpeechSynthesisUtterance(texte), v=voixNavChoisir(id);
    if(v) u.voice=v; u.lang=(v && v.lang) || 'fr-FR';
    const d=(VOIX_FICHES[id] && VOIX_FICHES[id].doublure) || {hauteur:1, debit:1};
    u.pitch=d.hauteur; u.rate=d.debit; u.onend=voixFin; u.onerror=voixFin;

  }catch(_){ return false; }
}

/* ─────────── le serveur, derrière VOICE_ENDPOINT ─────────── */
function voixEmpreinte(s){ let hh=5381; for(let i=0;i<s.length;i++){ hh=((hh<<5)+hh+s.charCodeAt(i))|0; } return (hh>>>0).toString(36); }
async function voixServeur(id, texte){
  const cle=String(VOICE_ENDPOINT).replace(/\/$/, '')+'/cache/'+encodeURIComponent(id)+'/'+encodeURIComponent(VOIX_CHOISIES[id].voiceId)+'/'+voixEmpreinte(texte)+'.'+VOICE_CONFIG.format;
  let blob=null, cache=null;
  try{ if(window.caches){ cache=await window.caches.open(VOICE_CONFIG.cache); const hit=await cache.match(cle); if(hit) blob=await hit.blob(); } }catch(_){ cache=null; }

    if(!blob){
      const r=await fetch(VOICE_ENDPOINT, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify({agent:id, voiceId:VOIX_CHOISIES[id].voiceId, text:texte, format:VOICE_CONFIG.format})});
      if(!r.ok) throw new Error('voix '+r.status);
      blob=await r.blob(); voixCompter('serveur', texte.length);
      try{ if(cache) await cache.put(cle, new Response(blob, {headers:{'Content-Type':'audio/'+VOICE_CONFIG.format}})); }catch(_){}
    }
    voixAudio=new Audio(URL.createObjectURL(blob)); voixAudio.onended=voixFin;
    await voixAudio.play();

  }catch(_){ voixFin(); toast('La voix de '+AG[id].nom+' ne répond pas pour l’instant.'); return false; }
}

/* ─────────── point d'entrée ─────────── */
function parler(id, texte, bouton){
  const a=AG[id]; if(!a) return;
  const t=voixTexte(texte); if(!t) return;
  if(!voixReveillee(id)){ toast('La voix de '+a.nom+' dort encore.'); return; }
  const moteur=voixConfiguree(id) ? 'serveur' : (voixNavDisponible() ? 'navigateur' : null);
  if(!moteur){ toast('La voix de '+a.nom+' arrive bientôt.'); return; }
  if(moteur==='serveur' && voixPlafondAtteint()){ toast('Les voix sont au repos jusqu’au début du mois prochain.'); return; }
  voixArreter();
  if(bouton){ voixBoutonActif=bouton; bouton.classList.add('playing'); }
  if(moteur==='serveur') voixServeur(id, t); else voixNavigateur(id, t);
}
function voixApresReponse(qui, texte){ try{ if(etat.voix.auto && voixReveillee(qui)) parler(qui, texte); }catch(_){} }

<script>
/* ══════════════════════════════════════════════════════════════════════════
   APP MIX — LES LANGUES (13/11/2026)
   Français, anglais, espagnol. Les textes sont écrits en français dans le
   code ; à l'affichage, chaque nœud de texte, chaque placeholder et chaque
   aria-label est traduit par le dictionnaire de la langue choisie
   (61-anglais.js, 62-espagnol.js), clé = la phrase française. Une phrase
   absente du dictionnaire reste en français. Quelques tournures composées
   (« Étape 1 sur 8 », « Bonjour, Léa ») passent par des règles.
   Jamais réécrit : ce que la personne tape, ce que le modèle répond, le
   contenu des jeux (en français pour l'instant). Le modèle reçoit la langue
   dans le dossier (33-lecture.js) et répond dans cette langue.
   ══════════════════════════════════════════════════════════════════════════ */

const LANGUES={fr:'Français', en:'English', es:'Español'};
const DICOS={en:{}, es:{}};      /* remplis par 61 et 62 */
const REGLES={en:[], es:[]};     /* [regex, remplacement] : règles écrites à la main, essayées avant tout découpage */
const REGLES_FIN={en:[], es:[]}; /* règles sans début fixe (« sommeil (3 sur 10) »), essayées après les gabarits */
const NOMS_LANGUE_MODELE={en:'anglais', es:'espagnol'};
function langue(){ return LANGUES[etat.langue] ? etat.langue : 'fr'; }
function nomLangueModele(){ return NOMS_LANGUE_MODELE[langue()] || ''; }

/* Les paires {masculin|féminin} d'une clé : à l'écran, tx() les a déjà résolues.
   On indexe donc chaque clé sous ses deux formes, chacune vers la valeur accordée de même. */
function paire(s, f){ return String(s).replace(/\{([^{}|]*)\|([^{}|]*)\}/g, function(_, m, ff){ return f ? ff : m; }); }
const INDEX_PAIRES={}, GABARITS={};
function echapperRegex(s){ return String(s).replace(/[.*+?^${}()|[\]\\]/g, '\\$&'); }
function indexPaires(l){
  if(INDEX_PAIRES[l]) return INDEX_PAIRES[l];
  const d=DICOS[l], x={}, g=[];
  Object.keys(d).forEach(function(k){
    const paires=/\{[^{}|]*\|[^{}|]*\}/.test(k), gabarit=/\{[xn]\}/.test(k);
    if(paires && !gabarit){ x[paire(k, false)]=paire(d[k], false); x[paire(k, true)]=paire(d[k], true); }
    /* « Tu dors {x} par nuit. » devient une règle : le morceau capturé est traduit à son tour */
    if(gabarit){
      (paires ? [false, true] : [false]).forEach(function(f){
        const re=new RegExp('^'+echapperRegex(paire(k, f)).replace(/\\\{x\\\}/g, '(.+)').replace(/\\\{n\\\}/g, '(\\d+)')+'$');
        g.push([re, paire(d[k], f).replace(/\{[xn]\}/g, '$1'), k.length]);
      });
    }
  });
  /* du plus précis au plus court : « Tu as des fiertés concrètes : « {x} ». » avant « Tu as {x}. » */
  g.sort(function(a, b){ return b[2]-a[2]; });
  GABARITS[l]=g;
  return (INDEX_PAIRES[l]=x);
}
function gabarits(l){ indexPaires(l); return GABARITS[l]; }
/* « la liberté, la sécurité et la famille » : une liste (liste(), 11-texte.js), traduite morceau par morceau,
   en prenant le « et » qui laisse tous les morceaux traduisibles. */
const ET_LISTE={en:' and ', es:' y '};
/* Un morceau de liste se traduit s'il est au dictionnaire, cité entre guillemets (mots de la personne), ou noté sur 10. */
function morceauTraduit(l, m){ return chercher(l, m)!=null || /^« .+ »$/.test(m) || /^.+ \(\d+ sur 10\)$/.test(m); }
function traduireListe(l, t){
  const positions=[]; let i=-1;
  while((i=t.indexOf(' et ', i+1))>=0) positions.push(i);
  for(let k=positions.length-1;k>=0;k--){
    const morceaux=t.slice(0, positions[k]).split(', ').concat([t.slice(positions[k]+4)]);
    if(!morceaux.every(function(m){ return morceauTraduit(l, m); })) continue;
    const trad=morceaux.map(function(m){ return traduire(m); });
    return trad.slice(0, -1).join(', ')+ET_LISTE[l]+trad[trad.length-1];
  }
  return null;
}
/* Plusieurs phrases dans un même texte (le compte-rendu composé ici). On cherche d'abord le plus long groupe de

function traduirePhrases(l, t){
